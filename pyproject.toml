[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conecta-unmsm"
version = "1.0.0"
description = "Orientación académica y bienestar UNMSM: FastAPI, Supabase y Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "google-genai>=1,<3",
  "supabase>=2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["backend", "backend.app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
